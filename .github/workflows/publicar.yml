name: Publicar avance
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El front no se compila: empaquetar.sh copia solo lo que el visitante necesita a dist/
      - run: bash empaquetar.sh
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: mi3-ss103.a2hosting.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
